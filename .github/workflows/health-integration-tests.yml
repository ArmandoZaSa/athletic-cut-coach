name: Health integration tests
on:
  push:
    paths:
      - 'site/health-core-v482.js'
      - 'tests/health-core.test.js'
      - '.github/workflows/health-integration-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check site/health-core-v482.js
      - name: Health integration tests
        run: node --test tests/health-core.test.js